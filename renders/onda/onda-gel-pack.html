<title>ONDA Gel Pack 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100,500;0,100,700;1,125,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: one full-bleed studio stage; a quiet caption top-left, a single control strip bottom-centre. */
  :root {
    color-scheme: dark;
    --stage: #0a2f8f;          /* studio wall, also the ground behind the canvas */
    --ink: #f3f7ff;            /* text on the stage */
    --ink-soft: rgba(243, 247, 255, 0.72);
    --panel: rgba(5, 16, 54, 0.62);
    --panel-line: rgba(243, 247, 255, 0.2);
    --ink-inverse: #06143f;    /* text on a pressed control */
    --hover: rgba(243, 247, 255, 0.12);
    --accent: #58b4ff;         /* the flavour-bar blue from the pack */
    --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root[data-look="neutral"] {
    color-scheme: light;
    --stage: #c9cdd4; --ink: #0b1b4d; --ink-soft: rgba(11, 27, 77, 0.7);
    --panel: rgba(255, 255, 255, 0.7); --panel-line: rgba(11, 27, 77, 0.18);
    --ink-inverse: #f3f7ff; --hover: rgba(11, 27, 77, 0.1); --accent: #1557d0;
  }
  html, body { height: 100%; }
  body {
    background: var(--stage);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    position: relative;
  }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  #stage canvas.dragging { cursor: grabbing; }
  #stage canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

  .caption {
    position: absolute;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .caption h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; }
  .caption p {
    margin: 0; font-family: var(--font-data); font-size: 0.7rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft);
  }

  .controls {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center;
    pointer-events: none;
  }
  .controls-inner {
    pointer-events: auto;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
    padding: 5px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .controls button {
    appearance: none; border: 0; background: transparent; color: var(--ink);
    font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 14px; border-radius: 999px; cursor: pointer;
  }
  .controls button:hover { background: var(--hover); }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--ink-inverse); }

  #fail {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    font-size: 0.95rem; line-height: 1.5;
  }
</style>

<div id="stage" aria-label="Rotatable 3D model of the ONDA gel pack"></div>

<div class="caption">

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

// ---------- dimensions (1 unit = 10 mm): 45 x 108 mm sachet, 24 g ----------
const W = 4.5, H = 10.8, T = 0.56;
// reference-photo box of the pack, used as the artwork coordinate system
const RX = 695, RY = 450, RW = 205, RH = 495;
const TW = 1700, TH = Math.round(TW * RH / RW);

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// half-width of the outline (0..1) at height v (0 bottom, 1 top): body, shoulders, tear neck
function halfWidth(v) {
  const neck = 0.53;
  let w = 1 - (1 - neck) * smooth(0.705, 0.862, v);
  if (v < 0.012) w -= 0.03 * (1 - v / 0.012) ** 2;       // softened bottom corners
  if (v > 0.99) w -= 0.05 * ((v - 0.99) / 0.01) ** 2;    // softened top corners
  return w;
}

function buildSide(sign) {
  const NU = 96, NV = 240;
  const pos = [], uv = [], idx = [];
  const ph = sign > 0 ? 0 : 1.7;
  for (let j = 0; j <= NV; j++) {
    const v = j / NV, hw = halfWidth(v);
    for (let i = 0; i <= NU; i++) {
      const u = (i / NU) * 2 - 1;
      const x = u * hw * W / 2;
      const sealFrac = 0.32 / (hw * W / 2);
      const s = Math.min(1, Math.max(0, (1 - Math.abs(u) - sealFrac) / (1 - sealFrac)));
      const pa = Math.pow(Math.sin(s * Math.PI / 2), 0.8);
      const t = Math.min(1, Math.max(0, (v - 0.058) / (0.885 - 0.058)));
      const pv = Math.pow(Math.sin(Math.PI * Math.pow(t, 0.72)), 0.62);
      let z = T * pa * pv * Math.pow(hw, 0.9);
      // film creases: gathers above the bottom seal and under the shoulders, soft dents in the body
      const m = pa * pv;
      z += 0.035 * m * Math.sin(u * 13 + ph * 2) * (1 - smooth(0, 0.3, t)) ** 1.5;
      z += 0.03 * m * Math.sin(u * 9 - 1 + ph) * smooth(0.62, 0.95, t);
      z += 0.022 * m * Math.sin(u * 2.7 + v * 15 + ph * 3) * Math.sin(v * 8.5 - u * 1.9 + ph);
      pos.push(x, v * H, sign * (z + 0.006));
      const U = x / W + 0.5;
      uv.push(sign > 0 ? U : 1 - U, v);
    }
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
    const a = j * (NU + 1) + i, b = a + 1, c = a + NU + 1, d = c + 1;
    if (sign > 0) idx.push(a, b, c, b, d, c); else idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ---------- artwork ----------
const FONT_TAG = 'italic 600 expanded {s}px Archivo, "Helvetica Neue", Arial, sans-serif';
const FONT_DATA = '500 {s}px "JetBrains Mono", ui-monospace, Menlo, monospace';
const font = (f, s) => f.replace('{s}', s);
const WHITE = '#f4f6fb';

function artCanvas() {
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const ctx = c.getContext('2d');
  ctx.setTransform(TW / RW, 0, 0, TH / RH, -RX * TW / RW, -RY * TH / RH);   // draw in reference-photo px
  return [c, ctx];
}
function baseFilm(ctx) {
  const g = ctx.createLinearGradient(0, RY, 0, RY + RH);
  g.addColorStop(0, '#0f3a9e'); g.addColorStop(0.3, '#1352c8'); g.addColorStop(1, '#1356d0');
  ctx.fillStyle = g; ctx.fillRect(RX - 2, RY - 2, RW + 4, RH + 4);
}
function rr(ctx, x, y, w, h, r) {   // r = [tl, tr, br, bl]
  const [a, b, c2, d] = Array.isArray(r) ? r : [r, r, r, r];
  ctx.moveTo(x + a, y); ctx.lineTo(x + w - b, y); ctx.arcTo(x + w, y, x + w, y + b, b);
  ctx.lineTo(x + w, y + h - c2); ctx.arcTo(x + w, y + h, x + w - c2, y + h, c2);
  ctx.lineTo(x + d, y + h); ctx.arcTo(x, y + h, x, y + h - d, d);
  ctx.lineTo(x, y + a); ctx.arcTo(x, y, x + a, y, a); ctx.closePath();
}
// the wordmark: four slab letters, counters cut as slits. Drawn upright in a (len x cap) box.
function wordmark(ctx, len, cap) {
  const gap = len * 0.021, w = (len - 3 * gap) / 4, sl = w * 0.1, k = cap / 83;
  ctx.fillStyle = WHITE;
  const at = n => n * (w + gap);
  let x = at(0);                                         // O
  ctx.beginPath(); rr(ctx, x, 0, w, cap, 21 * k); rr(ctx, x + w / 2 - sl / 2, 19 * k, sl, cap - 38 * k, sl / 2.2); ctx.fill('evenodd');
  x = at(1);                                             // N
  ctx.beginPath(); rr(ctx, x, 0, w, cap, [16 * k, 3 * k, 16 * k, 3 * k]);
  ctx.rect(x + w * 0.32 - sl / 2, 25 * k, sl, cap - 25 * k + 1); ctx.rect(x + w * 0.68 - sl / 2, -1, sl, cap - 25 * k + 1); ctx.fill('evenodd');
  x = at(2);                                             // D
  ctx.beginPath(); rr(ctx, x, 0, w, cap, [3 * k, 30 * k, 30 * k, 3 * k]); rr(ctx, x + w / 2 - sl / 2, 19 * k, sl, cap - 38 * k, sl / 2.2); ctx.fill('evenodd');
  x = at(3);                                             // A
  ctx.beginPath(); rr(ctx, x, 0, w, cap, [29 * k, 29 * k, 3 * k, 3 * k]);
  ctx.rect(x + w / 2 - sl / 2, 47 * k, sl, cap - 47 * k + 1); rr(ctx, x + w / 2 - sl / 2, 19 * k, sl, 14 * k, sl / 2.2); ctx.fill('evenodd');
}
// quarter-arch that runs up from the bottom edge and turns out to the side edge
function archPath(ctx, cx, cy, rx, ry, dir) {
  ctx.moveTo(cx - dir * rx, RY + RH + 4); ctx.lineTo(cx - dir * rx, cy);
  ctx.ellipse(cx, cy, rx, ry, 0, dir > 0 ? Math.PI : 0, 1.5 * Math.PI, dir < 0);
  ctx.lineTo(cx + dir * 6, cy - ry); ctx.lineTo(cx + dir * 6, RY + RH + 4); ctx.closePath();
}
function arch(ctx, cx, dir, cy = 792) {
  ctx.save();
  ctx.beginPath(); archPath(ctx, cx, cy, 91, 67, dir); ctx.clip();
  const g = ctx.createLinearGradient(0, cy - 67, 0, RY + RH);
  g.addColorStop(0, '#1148b4'); g.addColorStop(0.45, '#0c2f80'); g.addColorStop(1, '#040b26');
  ctx.fillStyle = g; ctx.fillRect(RX, 700, RW, 260);
  ctx.restore();
  ctx.fillStyle = WHITE;
  ctx.beginPath(); archPath(ctx, cx, cy, 121, 114, dir); archPath(ctx, cx, cy, 103, 80, dir); ctx.fill('evenodd');
  ctx.beginPath(); archPath(ctx, cx, cy, 97, 73.5, dir); archPath(ctx, cx, cy, 92, 68, dir); ctx.fill('evenodd');
}
function tagline(ctx, cx) {
  ctx.fillStyle = WHITE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(FONT_TAG, 8.2); try { ctx.letterSpacing = '0.5px'; } catch (e) {}
  ctx.fillText('PURSUE', cx, 479.5); ctx.fillText('EXCELLENCE', cx, 491.5);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
}
const ACTIVES = [['CREATINE MONOHYDRATE', '5000 MG'], ['TAURINE', '750 MG'], ['CITICOLINE (COGNIZIN®)', '125 MG'], ['L-THEANINE', '100 MG']];
function specRows(ctx, x0, x1, y0, step, size) {
  ctx.textBaseline = 'middle'; ctx.font = font(FONT_DATA, size);
  ACTIVES.forEach(([name, amt], i) => {
    const y = y0 + i * step;
    ctx.fillStyle = WHITE;
    ctx.textAlign = 'left'; ctx.fillText(name, x0, y);
    ctx.textAlign = 'right'; ctx.fillText(amt, x1, y);
    const a = x0 + ctx.measureText(name).width + size * 0.5, b = x1 - ctx.measureText(amt).width - size * 0.5;
    ctx.fillStyle = 'rgba(244,246,251,0.75)';
    for (let x = a; x < b; x += size * 0.42) ctx.fillRect(x, y + size * 0.28, size * 0.12, size * 0.12);
    if (i < ACTIVES.length - 1) { ctx.fillStyle = 'rgba(244,246,251,0.22)'; ctx.fillRect(x0, y + step / 2 - 0.15, x1 - x0, 0.3); }
  });
}

function drawFront() {
  const [c, ctx] = artCanvas();
  baseFilm(ctx);
  arch(ctx, 911, 1);
  ctx.save(); ctx.translate(697, 943); ctx.rotate(-Math.PI / 2); wordmark(ctx, 346, 83); ctx.restore();
  tagline(ctx, 797.5);
  // flavour bar + actives
  ctx.fillStyle = '#58b4ff'; ctx.fillRect(786, 595, 84, 9.5);
  ctx.fillStyle = '#0d2d8c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(FONT_DATA, 4.6); try { ctx.letterSpacing = '0.4px'; } catch (e) {}
  ctx.fillText('MIXED BERRY', 828, 600);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  specRows(ctx, 787, 869, 613.5, 13, 3.7);
  ctx.fillStyle = WHITE; ctx.textAlign = 'left'; ctx.font = font(FONT_DATA, 3.7);
  ctx.fillText('NET WT. 0.85 OZ (24G)', 826, 918);
  return c;
}
function drawBack() {
  const [c, ctx] = artCanvas();
  baseFilm(ctx);
  arch(ctx, 684, -1, 836);
  tagline(ctx, 797.5);
  ctx.save(); ctx.translate(729, 602); wordmark(ctx, 137, 33); ctx.restore();
  ctx.fillStyle = '#58b4ff'; ctx.fillRect(729, 648, 137, 1);
  ctx.fillStyle = WHITE; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = font(FONT_DATA, 4.6); try { ctx.letterSpacing = '0.4px'; } catch (e) {}
  ctx.fillText('ACTIVES PER PACK', 729, 660);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  specRows(ctx, 729, 866, 672, 11.5, 4.2);
  ctx.fillStyle = WHITE; ctx.textAlign = 'right'; ctx.font = font(FONT_DATA, 3.7);
  ctx.fillText('NET WT. 0.85 OZ (24G)', 890, 918);
  return c;
}
// height map: crimped heat-seals top and bottom, side-seal steps, film grain and a few soft creases
function drawBump() {
  const w = 850, h = Math.round(850 * RH / RW);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) {
    const x = rnd() * w, y = h * (0.12 + rnd() * 0.8), len = 60 + rnd() * 220, a = (rnd() - 0.5) * 1.2 + (rnd() < 0.5 ? 0 : Math.PI / 2);
    const g = ctx.createLinearGradient(x, y, x + Math.cos(a) * len, y + Math.sin(a) * len);
    const tone = rnd() < 0.5 ? '255,255,255' : '0,0,0';
    g.addColorStop(0, `rgba(${tone},0)`); g.addColorStop(0.5, `rgba(${tone},0.16)`); g.addColorStop(1, `rgba(${tone},0)`);
    ctx.strokeStyle = g; ctx.lineWidth = 5 + rnd() * 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
  }
  const crimp = (y0, y1) => { for (let y = y0; y < y1; y += 7) { ctx.fillStyle = '#a2a2a2'; ctx.fillRect(0, y, w, 3.5); ctx.fillStyle = '#626262'; ctx.fillRect(0, y + 3.5, w, 3.5); } };
  crimp(0, h * 0.105); crimp(h * 0.948, h);
  const side = w * 0.066;
  ctx.fillStyle = '#6e6e6e'; ctx.fillRect(side, h * 0.3, 3, h * 0.65); ctx.fillRect(w - side - 3, h * 0.3, 3, h * 0.65);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  return c;
}

// ---------- scene ----------
const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('fail').hidden = false; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
canvas.tabIndex = 0;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', 'ONDA gel pack. Drag or use arrow keys to rotate.');
stage.appendChild(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.5, 400);

const pack = new THREE.Group();
scene.add(pack);

function tex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const bump = new THREE.CanvasTexture(drawBump());
bump.anisotropy = 4;
const film = (map) => new THREE.MeshPhysicalMaterial({
  map, bumpMap: bump, bumpScale: 1.4,
  roughness: 0.36, metalness: 0.15, clearcoat: 0.45, clearcoatRoughness: 0.28, envMapIntensity: 1.15,
});
const frontMat = film(tex(drawFront())), backMat = film(tex(drawBack()));
const front = new THREE.Mesh(buildSide(1), frontMat), back = new THREE.Mesh(buildSide(-1), backMat);
for (const m of [front, back]) { m.castShadow = true; pack.add(m); }
pack.position.y = 0.02;

// floor + soft contact shadow
const floorMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0, envMapIntensity: 0 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(260, 64), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const blob = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.5, 'rgba(0,0,0,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.012; m.scale.set(W * 1.5, 1.6, 1); return m;
})();
pack.add(blob); blob.position.y = 0;   // turns with the pack so it stays under the footprint

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-9, 17, 14); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 7; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 14, bottom: -6, near: 1, far: 60 });
const rim = new THREE.DirectionalLight(0xffffff, 1.3); rim.position.set(10, 9, -12);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(11, 5, 12);
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 0.38);
scene.add(key, rim, fill, hemi);

// studio environment for reflections: a tinted room with softboxes, baked through PMREM
const pmrem = new THREE.PMREMGenerator(renderer);
function makeEnv(room, glow) {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(60, 40, 60), new THREE.MeshBasicMaterial({ color: room, side: THREE.BackSide })));
  const panel = (w, h, x, y, z, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(glow).multiplyScalar(i), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(26, 14, 0, 19, 4, 9);       // overhead softbox
  panel(5, 26, -22, 3, 12, 14);     // left strip
  panel(4, 22, 24, 2, 4, 7);        // right strip
  panel(14, 8, 6, 6, -26, 5);       // back kicker
  panel(18, 6, 0, -6, 26, 2.5);     // low front fill
  const t = pmrem.fromScene(s, 0.035).texture;
  s.traverse(o => { if (o.geometry) { o.geometry.dispose(); o.material.dispose(); } });
  return t;
}
function backdrop(top, horizon) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, top); g.addColorStop(0.62, horizon); g.addColorStop(1, horizon);
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const LOOKS = {
  blue:    { top: '#0a4fc0', horizon: '#08298a', floor: '#0c50c4', room: '#0a2a8c', glow: '#cfe2ff', tint: 0xbcd6ff, sky: 0x4d8dff, ground: 0x0b2f9a, exposure: 1.0 },
  neutral: { top: '#eef0f3', horizon: '#c9cdd4', floor: '#e3e6ea', room: '#8d9199', glow: '#ffffff', tint: 0xffffff, sky: 0xffffff, ground: 0x9a9da3, exposure: 0.92 },
};
const built = {};
function setLook(name) {
  const L = LOOKS[name];
  const b = built[name] || (built[name] = { env: makeEnv(L.room, L.glow), bg: backdrop(L.top, L.horizon) });
  scene.environment = b.env; scene.background = b.bg;
  scene.fog = new THREE.Fog(L.horizon, 42, 150);
  floorMat.color.set(L.floor);
  key.color.set(L.tint); rim.color.set(L.tint); fill.color.set(L.tint);
  hemi.color.set(L.sky); hemi.groundColor.set(L.ground);
  renderer.toneMappingExposure = L.exposure;
  document.documentElement.dataset.look = name;
}

// ---------- view state + controls ----------
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const view = { yaw: -0.5, pitch: 0.11, zoom: 1, vyaw: 0, spin: !reduced, target: null, fit: 30 };
const TARGET_Y = H * 0.47;

function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const half = THREE.MathUtils.degToRad(camera.fov / 2);
  const fitH = (H * 1.55 / 2) / Math.tan(half);
  const fitW = (W * 2.3 / 2) / (Math.tan(half) * camera.aspect);
  view.fit = Math.max(fitH, fitW);
}
new ResizeObserver(resize).observe(stage);

const pointers = new Map();
let pinch = 0, lastMove = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('dragging'); view.target = null; view.vyaw = 0;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    const k = 3.4 / Math.max(320, stage.clientWidth * 0.6);
    view.yaw += dx * k * 2; view.vyaw = dx * k * 2; lastMove = performance.now();
    view.pitch = THREE.MathUtils.clamp(view.pitch + dy * 0.006, 0.02, 1.25);
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) view.zoom = THREE.MathUtils.clamp(view.zoom * pinch / d, 0.45, 1.8); pinch = d;
  }
});
const release = e => {
  pointers.delete(e.pointerId); pinch = 0;
  if (!pointers.size) { canvas.classList.remove('dragging'); if (performance.now() - lastMove > 90) view.vyaw = 0; }
};
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', e => { e.preventDefault(); view.zoom = THREE.MathUtils.clamp(view.zoom * Math.exp(e.deltaY * 0.0012), 0.45, 1.8); }, { passive: false });
canvas.addEventListener('keydown', e => {
  const step = 0.12;
  if (e.key === 'ArrowLeft') view.yaw -= step; else if (e.key === 'ArrowRight') view.yaw += step;
  else if (e.key === 'ArrowUp') view.pitch = Math.min(1.25, view.pitch + step / 2);
  else if (e.key === 'ArrowDown') view.pitch = Math.max(0.02, view.pitch - step / 2);
  else if (e.key === '+' || e.key === '=') view.zoom = Math.max(0.45, view.zoom * 0.9);
  else if (e.key === '-') view.zoom = Math.min(1.8, view.zoom * 1.1);
  else return;
  view.target = null; e.preventDefault();
});

const spinBtn = document.getElementById('btn-spin'), studioBtn = document.getElementById('btn-studio');
const setSpin = on => { view.spin = on; spinBtn.setAttribute('aria-pressed', String(on)); };
const turnTo = yaw => {     // shortest way round to the requested face
  const tau = Math.PI * 2; let d = (yaw - view.yaw) % tau; if (d > Math.PI) d -= tau; if (d < -Math.PI) d += tau;
  view.target = { yaw: view.yaw + d, pitch: 0.06 }; view.vyaw = 0; setSpin(false);
};
document.getElementById('btn-front').addEventListener('click', () => turnTo(0));
document.getElementById('btn-back').addEventListener('click', () => turnTo(Math.PI));
spinBtn.addEventListener('click', () => { view.target = null; setSpin(!view.spin); });
let look = 'blue';
studioBtn.addEventListener('click', () => {
  look = look === 'blue' ? 'neutral' : 'blue'; setLook(look);
  studioBtn.setAttribute('aria-pressed', String(look === 'blue'));
});
spinBtn.setAttribute('aria-pressed', String(view.spin));

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (view.target) {
    const k = 1 - Math.exp(-dt * 6);
    view.yaw += (view.target.yaw - view.yaw) * k; view.pitch += (view.target.pitch - view.pitch) * k;
    if (Math.abs(view.target.yaw - view.yaw) < 0.001) { view.yaw = view.target.yaw; view.target = null; }
  } else if (!pointers.size) {
    if (Math.abs(view.vyaw) > 0.0004) { view.yaw += view.vyaw * dt * 60; view.vyaw *= Math.exp(-dt * 3.2); }
    else if (view.spin) view.yaw += dt * 0.42;
  }
  pack.rotation.y = view.yaw;
  const d = view.fit * view.zoom;
  camera.position.set(0, TARGET_Y + Math.sin(view.pitch) * d, Math.cos(view.pitch) * d);
  camera.lookAt(0, TARGET_Y - 0.25, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// the label uses web fonts; redraw once they are in, never wait on them to show the pack
function redrawArt() {
  for (const [mat, draw] of [[frontMat, drawFront], [backMat, drawBack]]) { const old = mat.map; mat.map = tex(draw()); old.dispose(); }
}
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(font(FONT_TAG, 40)), document.fonts.load(font(FONT_DATA, 40))]).then(redrawArt).catch(() => {});
}

window.__view = view;
setLook(look); resize(); requestAnimationFrame(frame);
</script>
